name = "TorusHamiltonDecompositionProgram"
version = "0.1.0"
keywords = ["lean4", "mathlib", "graph-theory", "hamiltonian-cycles", "cayley-digraphs"]
defaultTargets = ["D5Odd", "D7Odd", "TorusEven"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc2"

[[lean_lib]]
name = "D5Odd"

[[lean_lib]]
name = "D7Odd"

[[lean_lib]]
name = "TorusD4"

[[lean_lib]]
name = "TorusD3Odd"

[[lean_lib]]
name = "Shared"

[[lean_lib]]
name = "RoundComposite"

# Even-modulus main path (see docs/EVEN_MODULUS_FORMALIZATION_PLAN_20260910.md).
[[lean_lib]]
name = "TorusEven"

# Retained but retired attempts (Route E and conditional adapters).  Compiles, is never imported
# by a proof path, and is not a default target.
[[lean_lib]]
name = "TorusEvenAttic"

# Even-modulus D_3 (Route E) formalization, vendored from
# https://github.com/aria1th/Torus-Hamilton-Decomposition (formal/), same author.
[[lean_lib]]
name = "TorusD3Even"

[[lean_lib]]
name = "TorusD3Odometer"
